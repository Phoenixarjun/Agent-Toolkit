name: release

on:
  workflow_dispatch:
    inputs:
      release_version:
        description: "Release version tag (e.g. v0.1.0)"
        required: true
        default: "v0.1.0"
        type: string
      dry_run:
        description: "Perform dry-run build without publishing"
        required: true
        default: true
        type: boolean

permissions:
  contents: read

jobs:
  release-build:
    name: Build & Verify Release Packages
    runs-on: ubuntu-latest
    steps:
      - name: Validate Branch Authority
        run: |
          echo "Triggered ref: ${{ github.ref }}"
          if [ "${{ github.ref }}" != "refs/heads/main" ] && [ "${{ github.ref }}" != "refs/heads/dev" ]; then
            echo "Release workflows are only authorized from 'main' or 'dev'."
            exit 1
          fi

      - name: Checkout Source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Dependencies
        run: python -m pip install -r requirements.txt

      - name: Run Structural Validation
        run: python scripts/validate.py

      - name: Run Security Audit Evaluator
        run: python -m unittest discover -s evals/security-audit -p "test_*.py" -v

      - name: Run Scripts Test Suite (142 tests)
        run: python -m unittest discover -s scripts/tests -p "test_*.py" -v

      - name: Run Repository Tests Suite (97 tests)
        run: python -m unittest discover -s tests -p "test_*.py" -v

      - name: Preview Release Packaging Plan
        run: python scripts/release.py plan

      - name: Build Release Packages
        run: |
          python scripts/release.py build \
            --tag "${{ inputs.release_version }}" \
            --output-dir "dist/release"

      - name: Verify Release Assets & Index
        run: python scripts/release.py verify --dir "dist/release"

      - name: Upload Release Artifacts for Maintainer Review
        uses: actions/upload-artifact@v4
        with:
          name: agent-toolkit-release-${{ inputs.release_version }}
          path: dist/release/
          if-no-files-found: error
          retention-days: 14

      - name: Release Status Summary
        run: |
          echo "========================================================"
          echo "Release Build Status: SUCCESS"
          echo "Version: ${{ inputs.release_version }}"
          echo "Dry Run: ${{ inputs.dry_run }}"
          echo "Publication State: NOT PUBLISHED — AWAITING MAINTAINER APPROVAL"
          echo "========================================================"

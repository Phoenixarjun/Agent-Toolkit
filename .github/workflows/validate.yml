name: validate

'on':
  push:
    branches: [ dev ]
  pull_request:
    branches: [ dev ]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Validate repository metadata and artifacts
        run: python scripts/validate.py

      - name: Run main unit tests
        run: python -m unittest discover -s tests -p "test_*.py" -v

      - name: Run script and utility unit tests
        run: python -m unittest discover -s scripts/tests -p "test_*.py" -v

      - name: Run security audit validator tests
        run: python -m unittest discover -s evals/security-audit -p "test_*.py" -v

      - name: Verify behavioral evaluation definitions
        run: python scripts/run_eval.py --all --verify-definitions

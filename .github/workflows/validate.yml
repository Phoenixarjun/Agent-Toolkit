name: validate

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: python -m pip install -r requirements.txt
      - run: python scripts/validate.py
      - run: python -m unittest discover -s evals/security-audit -p "test_*.py" -v
      - run: python -m unittest discover -s scripts/tests -p "test_*.py" -v
      - run: python -m unittest discover -s tests -p "test_*.py" -v
      - run: python -m unittest discover -s tests/career -p "test_*.py" -v
      - run: node web-app/career/tests/components.test.cjs
      - run: node --test web-app/visualize/tests/*.test.mjs
      - run: python scripts/compile_distribution.py
      - run: node --test packages/cli/tests/*.test.mjs

name: npm-publish

on:
  workflow_dispatch:
    inputs:
      release_version:
        description: "Release candidate version (e.g. 0.1.0)"
        required: true
        default: "0.1.0"
        type: string
      dry_run:
        description: "Dry-run verification only (do not publish to registry)"
        required: true
        default: true
        type: boolean

permissions:
  contents: read
  id-token: write

jobs:
  publish-verification:
    name: Build, Verify & Publish npm Package
    runs-on: ubuntu-latest
    steps:
      - name: Validate Branch Authority
        run: |
          if [ "${{ github.ref }}" != "refs/heads/main" ]; then
            echo "npm distribution releases are only authorized from 'main'."
            exit 1
          fi

      - name: Checkout Source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          registry-url: "https://registry.npmjs.org/"

      - name: Install Python Dependencies
        run: python -m pip install -r requirements.txt

      - name: Structural Repository Validation
        run: python scripts/validate.py

      - name: Run Test Suites
        run: |
          python -m unittest discover -s tests -p "test_*.py" -v
          python -m unittest discover -s tests/career -p "test_*.py" -v
          node web-app/career/tests/components.test.cjs
          node --test web-app/visualize/tests/*.test.mjs

      - name: Compile Distribution Package
        run: python scripts/compile_distribution.py --output-dir dist/npm/cli --version "${{ inputs.release_version }}"

      - name: Run Node CLI Parity and Doctor Tests
        run: |
          node --test packages/cli/tests/*.test.mjs
          python -m unittest discover -s tests -p "test_npm_parity.py" -v

      - name: Generate & Inspect Candidate Tarball
        run: |
          cd dist/npm/cli
          npm pack --json --ignore-scripts > pack-summary.json
          cat pack-summary.json

      - name: Upload Candidate Tarball Artifact
        uses: actions/upload-artifact@v4
        with:
          name: agent-toolkit-core-cli-${{ inputs.release_version }}
          path: dist/npm/cli/*.tgz
          retention-days: 14

      - name: Publish to npm Registry
        if: ${{ inputs.dry_run == false }}
        run: |
          cd dist/npm/cli
          # For GitHub Actions Trusted Publishing (OIDC):
          # npm publish --access public --provenance
          # If using auth token secret:
          echo "//registry.npmjs.org/:_authToken=${NODE_AUTH_TOKEN}" > .npmrc
          npm publish --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

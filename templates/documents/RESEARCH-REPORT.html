<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="color-scheme" content="light">
  <title>{{PAGE_TITLE}}</title>
  <style>
    :root{--canvas:#f7f5f1;--paper:#fffdfa;--ink:#272c2c;--muted:#66706e;--line:#e5ded6;--bronze:#8a593b;--bronze-light:#f5ece3;--green:#28665b;--green-light:#e6f3ed;--amber:#865d29;--amber-light:#faf0db;--danger:#a2403d;--danger-light:#fbedeb;--shadow:0 8px 26px rgba(35,40,40,.035);--serif:Georgia,'Times New Roman',serif;--sans:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif}
    *,*::before,*::after{box-sizing:border-box}
    html{scroll-behavior:smooth;scroll-padding-top:95px}
    body{margin:0;color:var(--ink);background:var(--canvas);font-family:var(--sans);font-size:14px;line-height:1.65}
    a{color:#725034;text-underline-offset:3px}a:hover{color:#442e20}
    button,input{font:inherit}
    button{cursor:pointer}
    button:focus-visible,a:focus-visible,input:focus-visible,summary:focus-visible{outline:3px solid #ab7b58;outline-offset:3px}
    .topbar{background:rgba(255,253,250,.97);border-bottom:1px solid var(--line);position:sticky;top:0;z-index:10;backdrop-filter:blur(12px)}
    .topinner{max-width:1460px;margin:auto;padding:15px 28px;display:flex;justify-content:space-between;align-items:center;gap:18px}
    .brand{display:flex;align-items:center;gap:13px;min-width:0}
    .brand-icon{background:#423527;color:#fff;border-radius:6px;width:35px;height:35px;display:grid;place-items:center;font-family:var(--serif);font-size:23px;flex-shrink:0}
    .brand strong{display:block;font-weight:800;font-size:12px;letter-spacing:.14em;text-transform:uppercase}.brand small{display:block;color:var(--muted);font-size:11px}
    .top-actions{display:flex;gap:9px;align-items:center}.top-actions button{background:var(--paper);border:1px solid #d8d0c5;color:var(--ink);padding:8px 13px;border-radius:6px;font-size:12px;font-weight:700}
    .shell{display:grid;grid-template-columns:230px minmax(0,950px);justify-content:center;gap:50px;margin:0 auto;padding:44px 35px 100px;max-width:1460px}
    aside{align-self:start;position:sticky;top:106px}
    .side-label,.eyebrow{font-weight:800;letter-spacing:.17em;text-transform:uppercase;font-size:10px;color:var(--bronze)}
    nav{display:grid;gap:5px;margin-top:13px}nav a{display:flex;gap:10px;align-items:center;padding:10px 12px;border-radius:5px;color:#59615d;text-decoration:none;font-size:12px;font-weight:650}nav a:hover,nav a:focus{color:var(--bronze);background:#efe9e0}nav a span{font-size:10px;color:#9b9489;min-width:19px}nav a.active{color:#7e5435;background:#f0e6db;border-left:3px solid #a8754b}
    .side-info{margin-top:32px;padding:17px;border:1px solid var(--line);border-radius:5px;background:#fffdf9}.side-info h4{font-size:12px;margin:0 0 7px}.side-info p{font-size:11px;color:var(--muted);margin:6px 0;overflow-wrap:anywhere}
    main{min-width:0}.hero{padding:16px 0 27px;border-bottom:1px solid #ded5c9}
    h1{font-family:var(--serif);font-weight:500;font-size:clamp(35px,4.3vw,59px);letter-spacing:-.038em;line-height:1.12;margin:12px 0 17px;overflow-wrap:anywhere}
    .subtitle{font-family:var(--serif);font-size:17px;line-height:1.65;color:#5d615d;max-width:780px;margin:0}
    .hero-meta{display:flex;gap:12px;flex-wrap:wrap;margin-top:20px;color:var(--muted);font-size:11px;align-items:center}
    .chip{border:1px solid #dcd1c2;background:#f5f0e9;color:#77563c;font-size:10px;font-weight:800;padding:5px 9px;border-radius:4px;text-transform:uppercase;letter-spacing:.05em}
    .chip.partial,.status-qualified{background:var(--amber-light);color:var(--amber);border-color:#e8d5ac}.chip.complete,.status-supported{background:var(--green-light);color:var(--green);border-color:#bfded0}.chip.blocked,.status-disputed,.status-unverified{background:var(--danger-light);color:var(--danger);border-color:#f0c6c4}
    section{margin-top:35px;scroll-margin-top:90px}h2{font-family:var(--serif);font-weight:500;font-size:29px;margin:0 0 6px;letter-spacing:-.022em}h3{font-size:15px;letter-spacing:-.01em;margin:0 0 9px}.section-intro{margin:0 0 18px;color:var(--muted);font-size:12px}
    .report-card{border:1px solid var(--line);border-radius:6px;background:var(--paper);padding:24px;box-shadow:var(--shadow)}
    .statement{border-left:3px solid #ad855e;padding:17px 20px;background:#f5eee6;color:#3d3a34;font-family:var(--serif);font-size:17px;line-height:1.7;margin:14px 0}
    .coverage{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-top:16px}.metric{border:1px solid var(--line);border-top:3px solid #bd9777;padding:18px;background:var(--paper);border-radius:5px}.metric strong{display:block;font-size:25px;letter-spacing:-.04em;line-height:1.25}.metric span{font-size:11px;color:var(--muted)}
    .finding-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}.finding{border:1px solid var(--line);padding:22px;background:var(--paper);border-radius:5px}.finding .flag{font-size:10px;letter-spacing:.11em;color:var(--bronze);font-weight:800;text-transform:uppercase}.finding p{font-size:13px;color:#585f5e;margin:8px 0 12px}
    .pill-link{display:inline-flex;align-items:center;border:1px solid #e1d5c5;background:#f5eee5;color:#785335;padding:4px 9px;font-size:11px;font-weight:700;text-decoration:none;border-radius:3px;margin-right:4px;margin-bottom:4px}
    .claims-bar{display:flex;align-items:center;gap:10px;justify-content:space-between;flex-wrap:wrap;margin-bottom:15px}.filter{border:1px solid var(--line);background:#fff;padding:8px 11px;border-radius:5px;color:#48524f;min-width:210px;font-size:12px}
    .claim{padding:20px 22px;border:1px solid var(--line);border-left:3px solid #ae8865;background:var(--paper);border-radius:4px;margin-bottom:10px}.claim-head{display:flex;justify-content:space-between;gap:12px;align-items:start}.claim-id{font-size:11px;font-weight:800;letter-spacing:.05em;color:#866044}.claim p{margin:11px 0;color:#3b4240}.claim small{color:var(--muted);font-size:11px}.status{border:1px solid #d8cbb8;font-weight:750;font-size:10px;letter-spacing:.04em;border-radius:3px;padding:4px 7px;text-transform:uppercase}
    .source-btn{border:1px solid #dcd1c2;background:#f7f1e9;color:#765236;font-size:11px;font-weight:700;padding:5px 8px;border-radius:4px;margin:3px 5px 0 0}
    .source-btn:hover{background:#efe4d5}.claim .limitation{margin-top:10px;padding-top:10px;border-top:1px dashed #e1d5c9;color:#745f48;font-size:11px}
    .chart-card{padding:25px;border:1px solid var(--line);background:var(--paper);border-radius:5px;margin:13px 0 16px}.chart-card svg{width:100%;height:auto;display:block}.chart-sub{font-size:11px;color:var(--muted);margin:4px 0 15px}.chart-legend{display:flex;gap:16px;flex-wrap:wrap;font-size:11px;color:var(--muted);margin:8px 0}.swatch{display:inline-block;width:9px;height:9px;border-radius:99px;margin-right:5px}.chart-card details{margin-top:13px;font-size:12px}.chart-card details summary{cursor:pointer;font-weight:700;color:var(--bronze);padding:8px 0}
    table{width:100%;border-collapse:collapse;font-size:12px;margin-top:10px}th,td{text-align:left;padding:10px 9px;border-bottom:1px solid var(--line)}th{color:#4d514b;background:#f6f2ed;font-weight:800}td{color:#48534f;font-variant-numeric:tabular-nums}
    .source-list{display:grid;gap:12px}.source-row{display:grid;grid-template-columns:78px minmax(0,1fr);gap:15px;border:1px solid var(--line);padding:18px;background:var(--paper);border-radius:5px}.source-num{font-family:var(--serif);color:#956a48;font-size:22px}.source-row h3{margin:0;font-size:13px}.source-row p{margin:5px 0;font-size:11px;color:var(--muted);overflow-wrap:anywhere}
    details.source-detail summary{cursor:pointer;font-size:12px;color:var(--bronze);font-weight:750;margin-top:8px}blockquote.quote{border-left:2px solid #c4a380;margin:12px 0;padding-left:12px;color:#505652;font-size:12px;white-space:pre-wrap}
    .muted{color:var(--muted)}.note{padding:14px 17px;border:1px solid #e9dbc7;background:#faf2e5;border-radius:4px;margin-bottom:14px;font-size:12px}
    .bullets{padding-left:20px;color:#535b57;font-size:12px}.bullets li{margin-bottom:6px}.empty{padding:20px;border:1px dashed #d9cbbb;background:#fffdfa;color:var(--muted);font-size:12px}
    .footer{margin-top:45px;padding-top:16px;border-top:1px solid var(--line);font-size:11px;color:#777973}
    .sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0}
    @media(max-width:1000px){.shell{grid-template-columns:195px minmax(0,1fr);gap:25px;padding:28px 20px 70px}}
    @media(max-width:730px){.topinner{padding:12px 14px}.brand small{display:none}.shell{display:block;padding:20px 14px 50px}aside{position:static;margin-bottom:20px}.side-label,.side-info{display:none}nav{display:flex;overflow-x:auto;white-space:nowrap;gap:2px}nav a{padding:8px 10px}.hero{padding-top:4px}.hero h1{font-size:35px}.coverage{grid-template-columns:repeat(3,minmax(0,1fr))}.metric{padding:11px}.metric strong{font-size:20px}.finding-grid{grid-template-columns:1fr}.report-card,.chart-card{padding:17px}.source-row{grid-template-columns:50px minmax(0,1fr);gap:7px}.top-actions button{padding:7px 9px}}
    @media(max-width:390px){.coverage{grid-template-columns:1fr 1fr}.hero h1{font-size:30px}}
    @media(prefers-reduced-motion:reduce){html{scroll-behavior:auto}}
    @media print{.topbar,aside,.top-actions,.filters,.source-btn{display:none!important}body{background:#fff;color:#000}.shell{display:block;max-width:none;padding:0}.hero{padding:0}section{page-break-inside:avoid}.report-card,.finding,.claim,.chart-card{box-shadow:none;break-inside:avoid}details{display:block!important}details>*{display:block!important}a{text-decoration:none;color:inherit}h1{font-size:33px}}
  </style>
</head>
<body>
<div class="topbar"><div class="topinner">
  <div class="brand"><span class="brand-icon" aria-hidden="true">R</span><div><strong>Research / Evidence Audit</strong><small>Source-linked report dossier</small></div></div>
  <div class="top-actions"><button id="printBtn" type="button">Print / Save PDF</button></div>
</div></div>
{{REPORT_BODY}}
<script>
(function(){
  'use strict';
  var printBtn=document.getElementById('printBtn');if(printBtn)printBtn.addEventListener('click',function(){window.print()});
  var filter=document.getElementById('claim-filter');
  if(filter)filter.addEventListener('change',function(){document.querySelectorAll('[data-claim-status]').forEach(function(el){el.hidden=(filter.value!=='all'&&el.dataset.claimStatus!==filter.value)})});
  document.querySelectorAll('.source-btn').forEach(function(button){button.addEventListener('click',function(){var id=button.dataset.sourceId;var detail=document.getElementById('source-'+id);if(detail){detail.open=true;detail.scrollIntoView({behavior:'smooth',block:'center'});detail.querySelector('summary')?.focus()}})});
  var navLinks=Array.from(document.querySelectorAll('nav a[href^="#"]'));
  if('IntersectionObserver' in window){var observer=new IntersectionObserver(function(entries){entries.forEach(function(entry){if(entry.isIntersecting){navLinks.forEach(function(a){a.classList.toggle('active',a.getAttribute('href')==='#'+entry.target.id)})}})},{rootMargin:'-15% 0px -70% 0px'});document.querySelectorAll('main section[id]').forEach(function(el){observer.observe(el)})}
})();
</script>
</body>
</html>

schema_version: "1"

skills:
  - id: code-review
    path: skills/code-review
    category: quality
    domains:
      - software-engineering
      - git
    maturity: stable
    version: "1.2.0"
    optional_dependencies:
      workflows:
        - implementation-review-loop
  - id: intent-capture
    path: skills/intent-capture
    category: intent
    domains:
      - software-engineering
      - agent-engineering
    maturity: stable
    version: "1.1.0"
  - id: grill-me
    path: skills/grill-me
    category: reasoning
    domains:
      - cross-domain
      - discovery
      - decision-making
      - clarification
    maturity: experimental
    version: "1.1.0"
  - id: ui-ux-design
    path: skills/ui-ux-design
    category: design
    domains:
      - ui-ux
      - frontend
    maturity: stable
    version: "1.1.0"
    optional_dependencies:
      workflows:
        - ui-design-build-review
      rules:
        - ui-engineering-rules
      agents:
        - ui-critic
      knowledge:
        - intent-and-archetypes
        - visual-language
        - typography-and-color
        - interaction-and-motion
        - accessibility-and-usability
        - anti-generic-ui
        - review-rubric
      forms:
        - ui-design-intake
      templates:
        - design-brief
        - design-review
  - id: problem-to-solution
    path: skills/problem-to-solution
    category: product-discovery
    domains:
      - product-discovery
      - problem-framing
      - decision-making
    maturity: experimental
    version: "1.0.0"
    optional_dependencies:
      workflows:
        - problem-to-solution
      knowledge:
        - problem-framing
        - option-evaluation
      templates:
        - problem-brief
        - solution-option
        - decision-brief
  - id: tdd
    path: skills/tdd
    category: quality
    domains:
      - software-engineering
      - testing
    maturity: stable
    version: "1.0.0"
  - id: security-audit
    path: skills/security-audit
    category: security
    domains:
      - software-engineering
      - security
    maturity: experimental
    version: "2.0.0"
    dependencies:
      workflows:
        - security-audit
      agents:
        - security-auditor
        - security-authority-investigator
        - security-trust-path-investigator
        - security-coverage-critic
      knowledge:
        - security-assurance-principles
        - security-regulatory-applicability
      templates:
        - security-audit-report
  - id: tune
    path: skills/tune
    category: agent-engineering
    domains:
      - agent-engineering
      - developer-experience
    maturity: experimental
    version: "1.0.0"
  - id: teach
    path: skills/teach
    category: learning
    domains:
      - learning
      - developer-experience
    maturity: experimental
    version: "1.0.0"
    optional_dependencies:
      skills:
        - research
  - id: research
    path: skills/research
    category: research
    domains:
      - research
      - analysis
      - investigation
    maturity: experimental
    version: "1.0.0"
    optional_dependencies:
      workflows:
        - research
      agents:
        - research-scout
        - research-coverage-critic
        - research-evidence-verifier
      templates:
        - research-report
  - id: code-explore
    path: skills/code-explore
    category: engineering
    domains:
      - software-engineering
      - code-exploration
    maturity: experimental
    version: "1.0.1"
    optional_dependencies:
      workflows:
        - code-impact-exploration
      agents:
        - code-path-explorer
        - code-contract-explorer
        - code-coverage-critic
        - code-evidence-verifier
      templates:
        - code-impact-report
  - id: code
    path: skills/code
    category: engineering
    domains:
      - software-engineering
      - implementation
    maturity: stable
    version: "1.0.0"
    optional_dependencies:
      workflows:
        - implementation-review-loop
      agents:
        - code-builder
        - code-verifier
      templates:
        - code-implementation-report


  - id: app-check
    path: skills/app-check
    category: engineering
    domains:
      - software-engineering
      - health-assessment
    maturity: experimental
    version: "1.0.0"
    optional_dependencies:
      skills:
        - code-explore
        - tdd
        - grill-me
        - security-audit
        - code
      workflows:
        - application-health-assessment
      templates:
        - app-health-report

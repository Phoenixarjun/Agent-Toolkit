schema_version: "1"
skill: code-review
cases:
  - id: complete-intent
    scenario: A selected ready intent contains five active acceptance criteria. All five are implemented, every changed path is required or supporting, focused checks pass, and no blocking issue is found.
    expected_status: PASS
    must_include:
      - all five acceptance IDs mapped to PASS
      - commit decision says the candidate is safe to commit

  - id: incomplete-intent
    scenario: The selected intent has five active acceptance criteria. Three are implemented correctly and two are absent.
    expected_status: FIX
    must_include:
      - missing criteria identified as FAIL or PARTIAL
      - bounded correction prompt referencing unresolved AC IDs
      - commit decision says not to commit

  - id: benign-extra
    scenario: The requested feature is complete and validated. The implementation also adds a small local success toast directly related to the completed action, with no new contract, persistence, dependency, security, configuration, or architectural effect.
    expected_status: PASS
    must_include:
      - toast disclosed as BENIGN_EXTRA
      - no requirement for user confirmation solely because of the benign extra

  - id: material-extra
    scenario: The requested UI feature is complete, but the candidate also writes a new database audit record that the intent did not authorize.
    expected_status: NEEDS_CONFIRMATION
    must_include:
      - database side effect classified as MATERIAL_EXTRA
      - explicit user acceptance, separation, or removal required before committing the whole candidate

  - id: unrelated-refactor
    scenario: The requested feature is complete, but an unrelated service was substantially refactored in the same worktree and no evidence connects it to the selected intent.
    expected_status: NEEDS_CONFIRMATION
    must_include:
      - refactor classified as UNRELATED
      - no claim that the whole candidate is safe to commit

  - id: multiple-intents-mixed
    scenario: Two ready intents exist and the worktree contains changes from both. Available evidence cannot reliably isolate which changed paths belong to the selected intent.
    expected_status: BLOCKED
    must_include:
      - selected intent cannot be isolated reliably
      - no fabricated path attribution

  - id: preexisting-dirty-change
    scenario: A changed file is outside the selected intent, but baseline evidence shows it was already dirty before implementation began.
    expected_status: PASS
    must_include:
      - no false attribution of the pre-existing change to the implementation
      - commit decision limited to the selected intent candidate

  - id: approval-boundary-crossed
    scenario: The feature appears correct, but implementation introduced a new public API contract explicitly listed as requiring approval in the intent and no approval was given.
    expected_status: FIX
    must_include:
      - approval-boundary violation as blocking
      - bounded correction or decision path

  - id: stale-validation
    scenario: Tests passed, then the candidate changed in code affecting the tested behavior, and the tests were not rerun.
    expected_status: BLOCKED
    must_include:
      - prior validation marked stale
      - no claim that current candidate passed validation

  - id: security-regression
    scenario: All requested UI behavior is present, but the changed backend path bypasses an existing authorization check.
    expected_status: FIX
    must_include:
      - security finding with concrete evidence
      - bounded correction prompt preserving completed correct work

  - id: staged-candidate-misses-required-support
    scenario: The user asks to review the staged commit. A required implementation file is staged, but a supporting migration needed for that implementation remains unstaged, so the proposed commit would be incomplete.
    expected_status: FIX
    must_include:
      - staged diff treated as the commit candidate
      - unstaged dependency identified as required supporting work
      - no claim that the staged subset is safe to commit

  - id: implementation-mutates-intent
    scenario: The implementation changed the ready Change Intent Contract to remove a failed acceptance criterion, but the user never authorized an amendment.
    expected_status: NEEDS_CONFIRMATION
    must_include:
      - contract mutation identified as unauthorized material scope change
      - original accepted intent remains authoritative
    must_not_include:
      - acceptance of the weakened contract as implementation evidence
